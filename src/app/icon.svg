<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="devBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="devAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="glowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Outer tile background -->
  <rect width="32" height="32" rx="8" fill="url(#devBg)"/>

  <!-- Border outline -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="none" stroke="url(#glowBorder)" stroke-width="1.2"/>

  <!-- Left Bracket < -->
  <path d="M 10.5 10 L 4.5 16 L 10.5 22" 
        fill="none" 
        stroke="url(#devAccent)" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Forward Slash / -->
  <path d="M 18.5 9.5 L 13.5 22.5" 
        fill="none" 
        stroke="#38bdf8" 
        stroke-width="2.2" 
        stroke-linecap="round"/>

  <!-- Right Bracket > -->
  <path d="M 21.5 10 L 27.5 16 L 21.5 22" 
        fill="none" 
        stroke="url(#devAccent)" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
